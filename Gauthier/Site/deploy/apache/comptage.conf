<VirtualHost *:80>
  # Site public servi par Apache sur la VPS.
  ServerName _
  DocumentRoot /var/www/html

  # Autorise Apache à servir les fichiers compilés par Vite.
  <Directory "/var/www/html">
    AllowOverride All
    Require all granted
  </Directory>

  # Redirige les appels API du navigateur vers l’API Node locale ou tunnelisée.
  ProxyPass /api/ http://127.0.0.1:3001/api/
  ProxyPassReverse /api/ http://127.0.0.1:3001/api/

  # Redirige aussi Socket.IO pour le temps réel.
  ProxyPass /socket.io/ http://127.0.0.1:3001/socket.io/
  ProxyPassReverse /socket.io/ http://127.0.0.1:3001/socket.io/

  # Bloque les routes admin depuis la partie publique.
  <Location /api/admin>
    Require all denied
  </Location>

  # Exception : le QR public doit pouvoir vérifier son token.
  <Location /api/admin/verify>
    Require all granted
  </Location>

  # Exception : nécessaire pour invalider les sessions QR déjà ouvertes.
  <Location /api/admin/version>
    Require all granted
  </Location>
</VirtualHost>
