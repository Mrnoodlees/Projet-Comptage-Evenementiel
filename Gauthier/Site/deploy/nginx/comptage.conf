server {
  # Alternative Nginx au fichier Apache : sert le front et proxifie l’API.
  listen 80;
  server_name _;

  # Dossier contenant le build Vite (dist/ copié ici).
  root /var/www/comptage;
  index index.html;

  # SPA Vue : toute route inconnue retombe sur index.html.
  location / {
    try_files $uri /index.html;
  }

  # Proxy HTTP vers l’API Express.
  location /api/ {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
  }

  # Proxy WebSocket/Socket.IO vers l’API Express.
  location /socket.io/ {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
  }
}
